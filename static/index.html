<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PySeek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .logo-font { font-family: 'Bungee', cursive; }
        body { font-family: 'Inter', sans-serif; }
        @keyframes faintPulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 30px rgba(16,185,129,0.5)); }
        }
        .faint-pulse { animation: faintPulse 4s ease-in-out infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor-blink { animation: blink 0.8s infinite; }
        @keyframes smoothLoad {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        .animate-loading-bar { animation: smoothLoad 1.2s ease-out forwards; }

        .ai-markdown h1, .ai-markdown h2, .ai-markdown h3 { font-weight: bold; color: #34d399; margin-top: 0.75rem; margin-bottom: 0.35rem; }
        .ai-markdown h1 { font-size: 1.25rem; }
        .ai-markdown h2 { font-size: 1.1rem; }
        .ai-markdown h3 { font-size: 1rem; }
        .ai-markdown p { margin-bottom: 0.5rem; line-height: 1.6; color: #e4e4e7; }
        .ai-markdown ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; color: #e4e4e7; }
        .ai-markdown ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; color: #e4e4e7; }
        .ai-markdown li { margin-bottom: 0.25rem; }
        .ai-markdown strong { color: #f4f4f5; font-weight: 600; }
        .ai-markdown code { background-color: rgba(0, 0, 0, 0.4); padding: 0.15rem 0.3rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.9em; color: #34d399; }
    </style>
</head>
<body class="bg-gradient-to-b from-black via-zinc-950 to-emerald-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-6 selection:bg-emerald-500 selection:text-black">
    
    <div class="w-full max-w-4xl text-center mt-12">
        <h1 class="text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-green-300 to-teal-500 mb-2 tracking-wider logo-font drop-shadow-[0_0_25px_rgba(16,185,129,0.3)] faint-pulse">
            PYSEEK
        </h1>
        <div class="h-8 mb-8 flex items-center justify-center">
            <p id="typewriter-text" class="text-emerald-500/80 font-medium tracking-widest text-sm uppercase font-mono"></p>
            <span class="text-emerald-400 font-mono text-sm ml-1 cursor-blink">_</span>
        </div>
        
        <div class="flex gap-3 mb-10 bg-black/40 p-3 rounded-2xl border border-emerald-900/50 backdrop-blur-md shadow-2xl">
            <input type="text" id="query" placeholder="What to look for" class="flex-1 px-5 py-4 rounded-xl bg-zinc-900/90 border border-emerald-900/60 text-slate-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-500/20 text-lg transition">
            <button onclick="handleNewSearch()" aria-label="Search" class="bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-500 hover:to-green-400 text-black px-6 py-4 rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.4)] transition transform active:scale-95 flex items-center justify-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </button>
        </div>
        
        <div id="results" class="text-left space-y-5 mb-8"></div>
        <div id="pagination" class="flex flex-col items-center justify-center mb-16 hidden"></div>
    </div>

    <script>
        const fullText = "Multi-AI Hybrid Search Engine";
        let charIndex = 0, isDeleting = false;
        function typeWriterLoop() {
            const currentSub = document.getElementById("typewriter-text");
            if (!currentSub) return;
            if (!isDeleting) {
                currentSub.textContent = fullText.substring(0, charIndex + 1);
                charIndex++;
                if (charIndex === fullText.length) { isDeleting = true; setTimeout(typeWriterLoop, 4500); return; }
                setTimeout(typeWriterLoop, 80);
            } else {
                currentSub.textContent = fullText.substring(0, charIndex - 1);
                charIndex--;
                if (charIndex === 0) { isDeleting = false; setTimeout(typeWriterLoop, 1000); return; }
                setTimeout(typeWriterLoop, 40);
            }
        }
        setTimeout(typeWriterLoop, 500);

        let allResults = [];
        let aiSynthesisText = "";
        let currentPage = 1;
        let lastSearchedQuery = "";
        const resultsPerPage = 5;

        document.getElementById("query").addEventListener("keypress", function(event) {
            if (event.key === "Enter") handleNewSearch();
        });

        async function handleNewSearch() {
            const q = document.getElementById('query').value.trim();
            if (!q) return;
            
            if (q === lastSearchedQuery && allResults.length > 0) {
                goToPage(1);
                return;
            }

            lastSearchedQuery = q;
            currentPage = 1;
            const resDiv = document.getElementById('results');
            const pagDiv = document.getElementById('pagination');
            
            resDiv.innerHTML = `
                <div class='text-center py-10 space-y-3'>
                    <p class='text-emerald-400 font-mono tracking-widest text-sm uppercase animate-pulse'>Loading...</p>
                    <div class='w-48 mx-auto bg-black h-1.5 rounded-full overflow-hidden border border-emerald-900/40'>
                        <div class='bg-emerald-500 h-full rounded-full animate-loading-bar'></div>
                    </div>
                </div>
            `;
            pagDiv.classList.add('hidden');
            
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(q)}&max_results=40`);
                const data = await response.json();
                allResults = data.web_results || [];
                aiSynthesisText = ""; 
            } catch (err) {
                resDiv.innerHTML = "<div class='bg-red-950/40 p-6 rounded-2xl border border-red-900 text-center'><p class='text-red-400'>Error connecting to backend services.</p></div>";
                return;
            }

            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });

            fetchAISynthesisInBackground(q);
        }

        async function fetchAISynthesisInBackground(q) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 9000);

                const res = await fetch(`/api/ai-synthesis?q=${encodeURIComponent(q)}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();
                aiSynthesisText = data.ai_synthesis || "**AI Synthesis Notice:** No response content received.";
            } catch (e) {
                aiSynthesisText = "**AI Synthesis Notice:** Request timed out or could not reach OpenRouter.";
            }
            
            if (currentPage === 1) {
                const aiContainer = document.getElementById('ai-synthesis-wrapper');
                if (aiContainer) {
                    aiContainer.innerHTML = buildAIBoxHTML(aiSynthesisText);
                }
            }
        }

        function buildAIBoxHTML(text) {
            const parsedHtml = marked.parse(text);
            return `
                <div class='bg-zinc-900/90 border border-emerald-500/50 p-6 rounded-2xl mb-6 shadow-[0_0_20px_rgba(16,185,129,0.15)] relative'>
                    <div class='flex items-center gap-2 mb-3'>
                        <span class='h-3 w-3 rounded-full bg-emerald-400'></span>
                        <h3 class='text-emerald-400 font-mono font-bold uppercase tracking-wider text-sm'>AI Synthesis</h3>
                    </div>
                    <div id="ai-synthesis-container" class="relative overflow-hidden max-h-56 transition-all duration-300">
                        <div id="ai-synthesis-content" class='ai-markdown text-zinc-200 text-base'>${parsedHtml}</div>
                        <div id="ai-fade-gradient" class="absolute bottom-0 left-0 w-full h-12 bg-gradient-to-t from-zinc-900 to-transparent pointer-events-none"></div>
                    </div>
                    <button onclick="toggleAISynthesis()" id="ai-toggle-btn" class="mt-3 text-xs font-mono text-emerald-400 hover:text-emerald-300 flex items-center gap-1 transition focus:outline-none cursor-pointer">
                        <span>More</span>
                        <svg id="ai-toggle-icon" class="w-4 h-4 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </div>
            `;
        }

        function goToPage(page) {
            currentPage = page;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleAISynthesis() {
            const containerElem = document.getElementById('ai-synthesis-container');
            const gradientElem = document.getElementById('ai-fade-gradient');
            const btnElem = document.getElementById('ai-toggle-btn');
            const iconElem = document.getElementById('ai-toggle-icon');
            
            if (!containerElem) return;
            if (containerElem.classList.contains('max-h-56')) {
                containerElem.classList.remove('max-h-56');
                containerElem.style.maxHeight = 'none';
                gradientElem.style.display = 'none';
                btnElem.querySelector('span').textContent = 'Less';
                iconElem.classList.add('rotate-180');
            } else {
                containerElem.classList.add('max-h-56');
                containerElem.style.maxHeight = '14rem';
                gradientElem.style.display = 'block';
                btnElem.querySelector('span').textContent = 'More';
                iconElem.classList.remove('rotate-180');
            }
        }

        function renderPage() {
            const resDiv = document.getElementById('results');
            const pagDiv = document.getElementById('pagination');
            
            if (allResults.length === 0) {
                resDiv.innerHTML = "<div class='bg-zinc-900 p-6 rounded-2xl border border-zinc-800 text-center'><p class='text-zinc-400'>No results found matching your query.</p></div>";
                pagDiv.classList.add('hidden');
                return;
            }

            const totalResults = allResults.length;
            const totalPages = Math.min(Math.ceil(totalResults / resultsPerPage), 8);
            const startIndex = (currentPage - 1) * resultsPerPage;
            const endIndex = startIndex + resultsPerPage;
            const currentItems = allResults.slice(startIndex, endIndex);

            let html = "";
            if (currentPage === 1) {
                html += `<div id='ai-synthesis-wrapper'>`;
                if (aiSynthesisText) {
                    html += buildAIBoxHTML(aiSynthesisText);
                } else {
                    html += `
                        <div class='bg-zinc-900/60 border border-emerald-900/40 p-6 rounded-2xl mb-6 shadow-lg flex items-center justify-between'>
                            <div class='flex items-center gap-3'>
                                <span class='h-3 w-3 rounded-full bg-emerald-500 animate-pulse'></span>
                                <h3 class='text-emerald-500/80 font-mono font-medium tracking-wider text-sm animate-pulse'>Initiating AI Synthesis</h3>
                            </div>
                        </div>
                    `;
                }
                html += `</div>`;
            }

            html += `<div class='flex items-center justify-between mb-4 px-2'><h2 class='text-lg font-bold text-emerald-400 uppercase tracking-wider font-mono'>Results</h2><span class='text-xs text-zinc-400 font-mono'>Page ${currentPage} of ${totalPages} (${totalResults} fetched)</span></div>`;
            
            currentItems.forEach(r => {
                let domain = "";
                try {
                    const parsedUrl = new URL(r.url);
                    domain = parsedUrl.hostname;
                } catch(e) {
                    domain = "";
                }
                
                let faviconUrl = domain ? `https://www.google.com/s2/favicons?domain=${domain}&sz=64` : "";
                let iconHtml = "";
                
                if (r.source === 'Reddit') {
                    iconHtml = `<div class="w-6 h-6 rounded-full bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400 text-xs font-bold">r</div>`;
                } else if (r.source === 'X') {
                    iconHtml = `<div class="w-6 h-6 rounded-full bg-sky-500/20 border border-sky-500/40 flex items-center justify-center text-sky-400 text-xs font-bold">𝕏</div>`;
                } else if (faviconUrl) {
                    iconHtml = `<img src="${faviconUrl}" alt="" class="w-5 h-5 rounded-sm object-contain bg-black/55 p-0.5 border border-emerald-900/40" onerror="this.style.display='none'">`;
                } else {
                    iconHtml = `<div class="w-5 h-5 rounded-sm bg-emerald-900/30 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-[10px] font-mono">🌐</div>`;
                }

                let discussionTag = r.is_discussion ? `<span class="px-2.5 py-1 rounded-md bg-emerald-950/80 border border-emerald-500/40 text-emerald-400 text-[11px] font-mono uppercase tracking-wider">Discussions</span>` : '';

                html += `
                    <div class='bg-zinc-900/50 hover:bg-zinc-900 p-6 rounded-2xl border border-emerald-900/30 hover:border-emerald-500/80 transition-all duration-300 shadow-lg hover:shadow-[0_0_20px_rgba(16,185,129,0.15)] group'>
                        <div class='flex justify-between items-center mb-2'>
                            <div class='flex items-center gap-2.5 max-w-[75%]'>
                                ${iconHtml}
                                <span class='text-xs font-mono truncate text-emerald-600'>${r.url}</span>
                            </div>
                            ${discussionTag}
                        </div>
                        <a href='${r.url}' target='_blank' class='text-xl font-semibold text-emerald-300 group-hover:text-emerald-200 hover:underline block mb-2'>${r.title}</a>
                        <p class='text-zinc-300 text-base leading-relaxed line-clamp-4'>${r.snippet}</p>
                    </div>
                `;
            });
            resDiv.innerHTML = html;

            if (totalPages > 1) {
                let logoHtml = `<div class="flex items-center justify-center text-2xl font-extrabold logo-font tracking-wider mb-2 select-none cursor-pointer">`;
                logoHtml += `<span class="text-zinc-500 text-4xl mr-1">PYS</span>`;
                for (let i = 1; i <= totalPages; i++) {
                    let isCurrent = (i === currentPage);
                    let colorClass = isCurrent 
                        ? "text-emerald-400 text-2xl drop-shadow-[0_0_12px_rgba(16,185,129,0.9)] scale-110 transition inline-block px-0.5" 
                        : "text-zinc-500 text-2xl hover:text-zinc-300 transition px-0.5";
                    logoHtml += `<span onclick="goToPage(${i})" class="${colorClass}">e</span>`;
                }
                logoHtml += `<span class="text-zinc-500 text-4xl ml-1">K</span></div>`;
                pagDiv.innerHTML = logoHtml;
                pagDiv.classList.remove('hidden');
            } else {
                pagDiv.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
